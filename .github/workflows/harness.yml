name: harness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fail on drift
        run: ./harness check --manifest harness.manifest.json
      - name: Validate declared artifacts
        run: ./harness validate --manifest harness.manifest.json
      - name: Test
        run: npm test
